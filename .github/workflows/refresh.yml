name: Refresh plot data

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh The Curve and The Tests (Epoch AI, Wikipedia)
        run: |
          bash the-curve/src/fetch.sh
          python3 the-curve/build.py
          if [ -f the-tests/build.py ]; then python3 the-tests/build.py; fi

      - name: Refresh The Population Ledger (UN WPP)
        run: |
          bash population/src/fetch.sh && python3 population/build.py

      - name: Refresh The Report Card (OWID, World Bank, NAEP, NCES, OECD)
        run: |
          bash education/src/fetch.sh && python3 education/build.py

      - name: Refresh The National Debt (Treasury, FRED)
        run: |
          if [ -f national-debt/src/fetch.py ]; then
            python3 national-debt/src/fetch.py && python3 national-debt/build.py
          fi

      - name: Commit if anything changed
        run: |
          git config user.name "plotline-refresh"
          git config user.email "refresh@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Data refresh $(date -u +%F)"
          git push
